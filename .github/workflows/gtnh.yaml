name: gtnh
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build 1.7.10 Jar Explicitly
        run: ./gradlew -Pceleritas_target_versions=1.7.10 packageJar

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Celeritas-1.7.10-Jar
          path: "**/build/libs/**/*.jar"
